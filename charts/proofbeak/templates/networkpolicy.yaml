{{- if .Values.networkPolicy.enabled }}
{{- $egress := .Values.networkPolicy.egressRules -}}
{{- if .Values.networkPolicy.allowDNS -}}
{{- $dns := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .Values.networkPolicy.dnsNamespace)))) "ports" (list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53)) -}}
{{- $egress = prepend $egress $dns -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "proofbeak.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "proofbeak.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    {{- toYaml $egress | nindent 4 }}
{{- end }}
