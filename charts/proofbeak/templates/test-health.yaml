{{- if .Values.test.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "proofbeak.name" . }}-health-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    proofbeak-client: 'true'
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: {{ include "proofbeak.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      env:
        - name: PROOFBEAK_HEALTH_URL
          value: {{ printf "http://%s:%v/health" (include "proofbeak.name" .) .Values.service.port | quote }}
      command: [python, -c]
      args:
        - 'import os, urllib.request; response=urllib.request.urlopen(os.environ["PROOFBEAK_HEALTH_URL"], timeout=5); assert response.status == 200'
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 250m, memory: 128Mi}
{{- end }}
