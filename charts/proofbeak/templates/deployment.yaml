apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proofbeak.name" . }}
  labels:
    {{- include "proofbeak.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "proofbeak.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "proofbeak.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: proofbeak
          image: {{ include "proofbeak.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [proofbeak-server]
          args: [serve, --config, /run/proofbeak/config.json, --host, 0.0.0.0, --port, {{ .Values.service.port | quote }}]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.credentialsSecret | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /run/proofbeak
              readOnly: true
            - name: state
              mountPath: /var/lib/proofbeak
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: {{ required "existingSecret must contain the operator-owned configuration" .Values.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.configKey | quote }}
                path: config.json
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "proofbeak.name" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
