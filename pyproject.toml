[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proofbeak"
version = "0.7.0"
description = "Consumer-defined acceptance trials for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Esref Turkok"}]
keywords = ["agents", "acceptance-testing", "evidence", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/eturkok/proofbeak"
Documentation = "https://github.com/eturkok/proofbeak/blob/main/docs/installation.md"
Repository = "https://github.com/eturkok/proofbeak"
Issues = "https://github.com/eturkok/proofbeak/issues"
Changelog = "https://github.com/eturkok/proofbeak/blob/main/CHANGELOG.md"

[project.optional-dependencies]
calendar = ["icalendar>=6.1,<8"]
dev = ["ruff>=0.9,<1", "radicale>=3.5,<4", "jsonschema>=4.23,<5"]
agents = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "mcp>=1.26,<2", "httpx>=0.28,<1"]
connectors = ["jsonschema>=4.23,<5", "mcp>=1.26,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
proofbeak = "proofbeak.cli:main"
proofbeak-server = "proofbeak.server:main"
proofbeak-mcp = "proofbeak.interfaces.mcp:main"
proofbeak-pilot = "proofbeak.pilot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F"]
