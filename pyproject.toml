[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proofbeak"
version = "0.2.0.dev1"
description = "Consumer-defined acceptance trials for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Esref Turkok"}]
dependencies = []

[project.optional-dependencies]
calendar = ["icalendar>=6.1,<8"]
dev = ["ruff>=0.9,<1", "radicale>=3.5,<4"]

[project.scripts]
proofbeak = "proofbeak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F"]
