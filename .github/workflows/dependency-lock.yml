name: Runtime dependency lock

on:
  workflow_dispatch:
  push:
    branches: [feat/deployment-package]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'uv>=0.8,<1'
      - run: uv pip compile pyproject.toml requirements-build.in --extra agents --extra calendar --python-version 3.13 --generate-hashes --no-header --output-file requirements-runtime.lock
      - run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          content = base64.b64encode(Path('requirements-runtime.lock').read_bytes()).decode()
          for index in range(0, len(content), 12000):
              print('LOCK_CHUNK:' + content[index:index+12000])
          PY
      - run: |
          docker pull python:3.13-slim
          docker image inspect python:3.13-slim --format 'PYTHON_BASE_DIGEST:{{index .RepoDigests 0}}'
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-dependency-lock
          path: requirements-runtime.lock
          retention-days: 7
