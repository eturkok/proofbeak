name: Trials

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: read

jobs:
  capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: proofbeak
          POSTGRES_PASSWORD: qualification-only
          POSTGRES_DB: proofbeak
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proofbeak" --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[agents,connectors,postgres,dev]'
      - run: python tests/test_capabilities.py -v
      - run: python tests/test_capability_integration.py -v
        env:
          PROOFBEAK_REQUIRE_CAPABILITIES: '1'
          PROOFBEAK_TEST_POSTGRES_DSN: postgresql://proofbeak:qualification-only@127.0.0.1:5432/proofbeak
          PROOFBEAK_TEST_REDIS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-qualification
          path: reports/capability-qualification.json
          if-no-files-found: error
          retention-days: 14
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
        env:
          PROOFBEAK_REQUIRE_SCENARIO_HTTP: '1'
  radicale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[calendar,dev]'
      - run: python tests/test_radicale_integration.py -v
        env:
          PROOFBEAK_REQUIRE_INTEGRATION: '1'
          PROOFBEAK_INTEGRATION_REPORT: reports/radicale-integration.json
      - uses: actions/upload-artifact@v4
        with:
          name: radicale-trial-evidence
          path: reports/radicale-integration.*
          if-no-files-found: error
          retention-days: 7
  interfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[agents,dev]'
      - run: ruff check .
      - run: python tests/test_http.py -v
        env:
          PROOFBEAK_REQUIRE_INTERFACES: '1'
      - run: python tests/test_workflows_http.py -v
        env:
          PROOFBEAK_REQUIRE_INTERFACES: '1'
      - run: python tests/test_bundles.py -v
        env:
          PROOFBEAK_REQUIRE_SIGNING: '1'
      - run: python tests/test_connector_sdk.py -v
        env:
          PROOFBEAK_REQUIRE_SDK: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/proofbeak/web/app.js
      - run: python -m pip install 'playwright>=1.51,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/workbench_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-qualification
          path: reports/workbench/
          if-no-files-found: error
          retention-days: 14
      - run: python tests/test_mcp_integration.py -v
        env:
          PROOFBEAK_REQUIRE_INTERFACES: '1'
  webdav:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[agents,dev]'
      - run: docker build -f deploy/Dockerfile.webdav-apache --tag proofbeak-webdav-apache:test .
      - run: docker build -f deploy/Dockerfile.webdav-wsgi --tag proofbeak-webdav-wsgi:test .
      - run: docker compose -f compose.storage.yaml config --quiet
      - run: python tests/test_webdav_integration.py -v
        env:
          PROOFBEAK_REQUIRE_WEBDAV: '1'
          PROOFBEAK_WEBDAV_REPORT_DIR: reports/webdav
      - run: python tests/test_mcp_storage_integration.py -v
        env:
          PROOFBEAK_REQUIRE_MCP_STORAGE: '1'
          PROOFBEAK_AGENT_FLOW_REPORT_DIR: reports/agent-flow
      - run: python tests/test_scenario_integration.py -v
        env:
          PROOFBEAK_REQUIRE_SCENARIOS: '1'
          PROOFBEAK_SCENARIO_REPORT_DIR: reports/scenarios
      - run: python tests/test_acceptance_integration.py -v
        env:
          PROOFBEAK_REQUIRE_ACCEPTANCE: '1'
          PROOFBEAK_ACCEPTANCE_REPORT_DIR: reports/acceptance
      - run: PYTHONPATH=src python tests/stability_soak.py --http --iterations 30 --output reports/qualification-http/http-soak.json
        env:
          PROOFBEAK_WEBDAV_REPORT_DIR: reports/qualification-http
      - uses: actions/upload-artifact@v4
        with:
          name: storage-provider-comparison-evidence
          path: reports/webdav/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-storage-workflow-evidence
          path: reports/agent-flow/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: user-defined-scenario-evidence
          path: reports/scenarios/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evaluation-evidence
          path: reports/acceptance/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: stability-http-qualification
          path: reports/qualification-http/*
          if-no-files-found: error
          retention-days: 7
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: PYTHONPATH=src python tests/upgrade_smoke.py
      - run: PYTHONPATH=src python tests/stability_soak.py --iterations 60 --output reports/filesystem-soak.json
      - uses: actions/upload-artifact@v4
        with:
          name: stability-core-qualification
          path: |
            reports/upgrade-smoke.json
            reports/filesystem-soak.json
          if-no-files-found: error
          retention-days: 7
